<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>MyMQTTX · Agent MQTT 测试台</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="MyMQTTX">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32"><path d="M7 22V10l9 8 9-8v12"/><path d="M7 10l9-6 9 6"/></svg>
          </div>
          <div>
            <div class="brand-name">MyMQTTX</div>
            <div class="brand-subtitle">AGENT MQTT TESTBENCH</div>
          </div>
        </div>

        <div class="topbar-center">
          <div class="session-pill">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">未连接</span>
          </div>
        </div>

        <div class="top-actions">
          <button class="button button-ghost" id="clearMessagesBtn" title="清空当前消息">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m-9 0 1 15h8l1-15M10 10v7m4-7v7"/></svg>
            清空消息
          </button>
          <button class="button button-connect" id="connectionBtn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10m5.7-6.7a8 8 0 1 1-11.4 0"/></svg>
            <span>连接 Broker</span>
          </button>
        </div>
      </header>

      <div class="content-grid">
        <aside class="subscriptions-panel">
          <div class="panel-heading">
            <div>
              <div class="eyebrow">SUBSCRIPTIONS</div>
              <h1>订阅窗口</h1>
            </div>
            <span class="count-badge" id="subscriptionCount">0</span>
          </div>

          <button class="button add-subscription" id="addSubscriptionBtn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            添加订阅
          </button>

          <div class="search-box">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <input id="subscriptionSearch" type="search" placeholder="筛选 topic" autocomplete="off">
          </div>

          <div class="subscription-list" id="subscriptionList"></div>
          <div class="aside-tip">右键点击 topic，可编辑、暂停或删除</div>
        </aside>

        <main class="workspace">
          <section class="monitor-section">
            <div class="monitor-toolbar">
              <div>
                <div class="eyebrow">LIVE TRAFFIC</div>
                <h2>消息流</h2>
              </div>
              <div class="toolbar-right">
                <div class="segmented" id="messageFilter" aria-label="消息筛选">
                  <button class="active" data-filter="all">全部</button>
                  <button data-filter="received">已接收</button>
                  <button data-filter="sent">已发送</button>
                </div>
                <label class="pause-control" title="暂停页面渲染，不影响 MQTT 接收">
                  <input type="checkbox" id="pauseMessages">
                  <span>暂停滚动</span>
                </label>
              </div>
            </div>

            <div class="message-viewport" id="messageViewport">
              <div class="empty-state" id="emptyState">
                <div class="empty-icon">
                  <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M10 14h28v20H10z"/><path d="m10 17 14 10 14-10"/></svg>
                </div>
                <h3>等待 MQTT 消息</h3>
                <p>连接本地 Broker 后，已启用的订阅会自动开始接收。</p>
              </div>
              <div class="message-list" id="messageList"></div>
            </div>
          </section>

          <div class="publisher-resizer" id="publisherResizer" role="separator" aria-orientation="horizontal" title="上下拖动调整发布窗口高度"></div>

          <section class="publisher-section">
            <div class="publisher-heading">
              <div>
                <span class="eyebrow">PUBLISHER</span>
                <strong>发布窗口</strong>
              </div>
              <div class="scroll-hint">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 7-5 5 5 5m8-10 5 5-5 5"/></svg>
                拖动或滚轮切换 topic
              </div>
            </div>

            <div class="topic-rail-wrap">
              <button class="rail-arrow" id="railPrevBtn" aria-label="向左滚动">‹</button>
              <div class="topic-rail" id="topicRail"></div>
              <button class="rail-arrow" id="railNextBtn" aria-label="向右滚动">›</button>
              <button class="add-topic-card" id="addPublishTopicBtn">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                添加发布
              </button>
            </div>

            <div class="publish-editor" id="publishEditor">
              <div class="editor-toolbar">
                <div class="topic-title" title="当前发布 Topic">
                  <span class="topic-indicator"></span>
                  <span id="activePublishTopic">—</span>
                  <span class="message-type" id="activePublishType">JSON</span>
                  <div class="validation-status" id="validationStatus">
                    <span></span>
                    <span>JSON</span>
                  </div>
                  <span class="payload-size" id="payloadSize">0 B</span>
                </div>
                <div class="editor-controls">
                  <label class="field compact-field">
                    <span>QoS</span>
                    <select id="publishQos">
                      <option value="0">0</option>
                      <option value="1">1</option>
                      <option value="2">2</option>
                    </select>
                  </label>
                  <label class="switch-field">
                    <input type="checkbox" id="publishRetain">
                    <span class="switch"><i></i></span>
                    <span>Retain</span>
                  </label>
                  <label class="field frequency-field">
                    <span>发送频率</span>
                    <select id="publishInterval">
                      <option value="0">单次</option>
                      <option value="500">500 ms</option>
                      <option value="1000">1 秒</option>
                      <option value="2000">2 秒</option>
                      <option value="5000">5 秒</option>
                      <option value="10000">10 秒</option>
                      <option value="30000">30 秒</option>
                      <option value="60000">60 秒</option>
                      <option value="custom">自定义</option>
                    </select>
                  </label>
                  <label class="field custom-interval hidden" id="customIntervalField">
                    <input type="number" id="customInterval" min="100" max="86400000" step="100" value="3000">
                    <span>ms</span>
                  </label>
                  <button class="button save-button" id="savePublishBtn">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h12l2 2v14H5z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></svg>
                    保存当前配置
                  </button>
                </div>
              </div>

              <textarea id="payloadEditor" spellcheck="false" aria-label="JSON Payload"></textarea>
              <div class="editor-actions">
                <button class="button stop-button hidden" id="stopPublishBtn">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                  停止循环
                </button>
                <button class="button send-button" id="sendPublishBtn">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>
                  <span>发送一次</span>
                </button>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <dialog class="modal" id="appModal">
      <form method="dialog" id="modalForm">
        <div class="modal-header">
          <div>
            <div class="eyebrow" id="modalEyebrow">SETTINGS</div>
            <h2 id="modalTitle">设置</h2>
          </div>
          <button class="icon-button" value="cancel" aria-label="关闭" formnovalidate>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-actions">
          <button class="button button-ghost" value="cancel" formnovalidate>取消</button>
          <button class="button button-primary" id="modalConfirmBtn" value="default">确认</button>
        </div>
      </form>
    </dialog>

    <div class="context-menu hidden" id="contextMenu" role="menu"></div>
    <div class="toast-region" id="toastRegion" aria-live="polite"></div>

    <script src="/app.js"></script>
  </body>
</html>
